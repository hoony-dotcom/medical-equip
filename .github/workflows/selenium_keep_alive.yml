name: Multiple Streamlit Keep Alive

on:
  schedule:
    - cron: '0 */3 * * *'  # 3시간마다 실행
  workflow_dispatch:        # 수동 실행 버튼 활성화

jobs:
  run-selenium-batch:
    runs-on: ubuntu-24.04   # 💡 최신 우분투 환경을 명시하여 ubuntu-latest 마이그레이션 대비
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5  # 💡 v4에서 v5로 최신화

      - name: Set up Python
        uses: actions/setup-python@v6  # 💡 v5에서 v6으로 최신화
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Run Keep-Alive Script
        run: |
          python keep_alive.py